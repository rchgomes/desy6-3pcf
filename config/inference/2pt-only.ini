; Shear 2pt-only analysis with the same modelling choices, as a baseline for
; the joint analysis.
;
;   cosmosis config/inference/2pt-only.ini [-p DEFAULT.cosmo=wcdm DEFAULT.ia=tatt]

[DEFAULT]
cosmo = lcdm
ia = nla
2pt_file = ${DESY6_3PCF_DIR}/data/dv/2pt.fits
output_dir = ${DESY6_3PCF_DIR}/output/chains
run_name = 2pt-%(cosmo)s-%(ia)s

[runtime]
sampler = polychord
verbosity = standard

[pipeline]
modules = consistency  bbn_consistency  camb
          fast_pt  fits_nz  source_photoz_bias  IA
          pk_to_cl  add_intrinsic  2pt_shear  shear_m_bias
          2pt_like
likelihoods = 2pt
values = ${DESY6_3PCF_DIR}/config/values/%(cosmo)s-%(ia)s.ini
priors = ${DESY6_3PCF_DIR}/config/priors/des-y6-priors.ini
extra_output = cosmological_parameters/sigma_8  data_vector/2pt_chi2
timing = F
debug = F

[output]
filename = %(output_dir)s/%(run_name)s.txt
format = text

%include ${DESY6_3PCF_DIR}/config/common/cosmology.ini
%include ${DESY6_3PCF_DIR}/config/common/cosmic-shear.ini
%include ${DESY6_3PCF_DIR}/config/common/samplers.ini
