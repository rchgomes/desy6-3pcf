; <Map^3>-only analysis with the emulators.
;
;   cosmosis config/inference/map3-only.ini [-p DEFAULT.cosmo=wcdm DEFAULT.ia=tatt]
;
; The 2pt file is only used for the source redshift distributions.

[DEFAULT]
cosmo = lcdm
ia = nla
2pt_file = ${DESY6_3PCF_DIR}/data/dv/2pt.fits
map3_file = ${DESY6_3PCF_DIR}/data/dv/map3.fits
joint_cov_file = ${DESY6_3PCF_DIR}/data/dv/cov_xip_xim_map3.fits
emulator_dir = ${DESY6_3PCF_DIR}/data/emulators
output_dir = ${DESY6_3PCF_DIR}/output/chains
run_name = map3-%(cosmo)s-%(ia)s

[runtime]
sampler = polychord
verbosity = standard

[pipeline]
modules = consistency  bbn_consistency  camb
          fits_nz  source_photoz_bias
          map3_binning  map3_emulator  map3_m_bias  map3_like
likelihoods = map3
values = ${DESY6_3PCF_DIR}/config/values/%(cosmo)s-%(ia)s.ini
priors = ${DESY6_3PCF_DIR}/config/priors/des-y6-priors.ini
extra_output = cosmological_parameters/sigma_8  data_vector/map3_chi2
timing = F
debug = F

[output]
filename = %(output_dir)s/%(run_name)s.txt
format = text

%include ${DESY6_3PCF_DIR}/config/common/cosmology.ini
%include ${DESY6_3PCF_DIR}/config/common/cosmic-shear.ini
%include ${DESY6_3PCF_DIR}/config/common/map3.ini
%include ${DESY6_3PCF_DIR}/config/common/samplers.ini
