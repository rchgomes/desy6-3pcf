; Joint analysis of the shear 2pt functions and <Map^3>, with the emulators.
;
;   cosmosis config/inference/joint-2pt-map3.ini
;   cosmosis config/inference/joint-2pt-map3.ini -p DEFAULT.cosmo=wcdm DEFAULT.ia=tatt
;   mpirun -n 64 cosmosis --mpi config/inference/joint-2pt-map3.ini

[DEFAULT]
; --- model: lcdm | wcdm,  nla | tatt
cosmo = lcdm
ia = nla
; --- inputs
2pt_file = ${DESY6_3PCF_DIR}/data/dv/2pt.fits
map3_file = ${DESY6_3PCF_DIR}/data/dv/map3.fits
joint_cov_file = ${DESY6_3PCF_DIR}/data/dv/cov_xip_xim_map3.fits
emulator_dir = ${DESY6_3PCF_DIR}/data/emulators
; --- outputs
output_dir = ${DESY6_3PCF_DIR}/output/chains
run_name = joint-2pt-map3-%(cosmo)s-%(ia)s

[runtime]
sampler = polychord
verbosity = standard

[pipeline]
modules = consistency  bbn_consistency  camb
          fast_pt  fits_nz  source_photoz_bias  IA
          pk_to_cl  add_intrinsic  2pt_shear  shear_m_bias
          2pt_like  2pt_mask
          map3_binning  map3_emulator  map3_m_bias  map3_like
          joint_like
likelihoods = joint
values = ${DESY6_3PCF_DIR}/config/values/%(cosmo)s-%(ia)s.ini
priors = ${DESY6_3PCF_DIR}/config/priors/des-y6-priors.ini
extra_output = cosmological_parameters/sigma_8  data_vector/2pt_chi2  data_vector/map3_chi2  data_vector/joint_chi2
timing = F
debug = F

[output]
filename = %(output_dir)s/%(run_name)s.txt
format = text

%include ${DESY6_3PCF_DIR}/config/common/cosmology.ini
%include ${DESY6_3PCF_DIR}/config/common/cosmic-shear.ini
%include ${DESY6_3PCF_DIR}/config/common/map3.ini
%include ${DESY6_3PCF_DIR}/config/common/samplers.ini

; Settings specific to this analysis (these override the included files).
; If the joint covariance comes from simulations, give their number and the
; number of sampled parameters here:
; [joint_like]
; covariance_realizations = 1000
; free_parameters = 16
; percival = T
