; Fisher forecast of the joint 2pt + <Map^3> analysis, using the emulators.
;
;   cosmosis config/fisher/joint-emulator.ini [-p DEFAULT.cosmo=wcdm DEFAULT.ia=tatt]
;   python scripts/fisher_summary.py output/fisher/fisher-joint-emulator-lcdm-nla.txt
;
; Same pipeline as the chains; only the sampler and the output change.

%include ${DESY6_3PCF_DIR}/config/inference/joint-2pt-map3.ini

[DEFAULT]
output_dir = ${DESY6_3PCF_DIR}/output/fisher
run_name = fisher-joint-emulator-%(cosmo)s-%(ia)s

[runtime]
sampler = fisher
