; Fisher forecast of the joint 2pt + <Map^3> analysis with the brute-force
; fastnc calculation: no emulator needed, so this can be run before any
; training set exists.  Each pipeline evaluation takes minutes (all
; tomographic triplets); the fisher sampler needs four per varied parameter
; and parallelises over them with MPI:
;
;   mpirun -n 32 cosmosis --mpi config/fisher/joint-fastnc.ini
;
; cosmo and ia can be overridden as usual, but brute-force TATT
; (-p DEFAULT.ia=tatt) is far more expensive: tens of minutes and ~10 GB of
; memory per evaluation.  Prefer the emulator version for TATT forecasts.

%include ${DESY6_3PCF_DIR}/config/inference/joint-2pt-map3.ini

[DEFAULT]
output_dir = ${DESY6_3PCF_DIR}/output/fisher
run_name = fisher-joint-fastnc-%(cosmo)s-%(ia)s

[runtime]
sampler = fisher

[pipeline]
modules = consistency  bbn_consistency  camb
          fast_pt  fits_nz  source_photoz_bias  IA
          pk_to_cl  add_intrinsic  2pt_shear  shear_m_bias
          2pt_like  2pt_mask
          map3_binning  fastnc  nc_to_map3  map3_m_bias  map3_like
          joint_like
