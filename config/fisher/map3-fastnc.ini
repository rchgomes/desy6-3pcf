; Fisher forecast of the <Map^3>-only analysis with brute-force fastnc
; (see joint-fastnc.ini for the cost).
;
;   mpirun -n 32 cosmosis --mpi config/fisher/map3-fastnc.ini

%include ${DESY6_3PCF_DIR}/config/inference/map3-only.ini

[DEFAULT]
output_dir = ${DESY6_3PCF_DIR}/output/fisher
run_name = fisher-map3-fastnc-%(cosmo)s-%(ia)s

[runtime]
sampler = fisher

[pipeline]
modules = consistency  bbn_consistency  camb
          fits_nz  source_photoz_bias
          map3_binning  fastnc  nc_to_map3  map3_m_bias  map3_like
