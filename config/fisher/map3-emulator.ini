; Fisher forecast of the <Map^3>-only analysis, using the emulators.
;
;   cosmosis config/fisher/map3-emulator.ini [-p DEFAULT.cosmo=wcdm DEFAULT.ia=tatt]

%include ${DESY6_3PCF_DIR}/config/inference/map3-only.ini

[DEFAULT]
output_dir = ${DESY6_3PCF_DIR}/output/fisher
run_name = fisher-map3-emulator-%(cosmo)s-%(ia)s

[runtime]
sampler = fisher
