; Training sets of the TATT emulators: one of the seven intrinsic-alignment
; components (ddE dEd Edd dEE EdE EEd EEE) on thin redshift slices.
;
;   python scripts/make_training_samples.py tatt --n 5000 --chunks 5
;   mpirun -n 32 cosmosis --mpi config/emulator/training-tatt.ini -p DEFAULT.component=ddE DEFAULT.chunk=0
;   ... for every component and chunk (all components share the samples)

[DEFAULT]
component = ddE
chunk = 0
sample_dir = ${DESY6_3PCF_DIR}/data/training/samples
output_dir = ${DESY6_3PCF_DIR}/data/training/output

[runtime]
sampler = list
verbosity = quiet

[list]
filename = %(sample_dir)s/tatt_%(chunk)s.txt

[output]
filename = %(output_dir)s/tatt_%(component)s_%(chunk)s.txt
format = text

[pipeline]
modules = consistency  bbn_consistency  camb  map3_binning  fastnc  nc_to_map3
values = ${DESY6_3PCF_DIR}/config/emulator/values-training.ini
; (number of redshift slices) x (number of filters) = 64 x 5
extra_output = map3/vector#320
timing = F
debug = F

%include ${DESY6_3PCF_DIR}/config/common/cosmology.ini

[map3_binning]
file = ${DESY6_3PCF_DIR}/modules/map3_binning.py
slices = T

[fastnc]
file = ${DESY6_3PCF_DIR}/modules/fastnc_interface.py
matter_model = none
ia_model = tatt
tatt_component = %(component)s
; The tree-level NLA-like part of each component is left to the NLA kernel
; of the reference emulator.  train_emulator.py must be told if this changes.
remove_alignment = T
use_pixwin = F
use_cache = T

[nc_to_map3]
file = ${DESY6_3PCF_DIR}/modules/nc_to_map3.py
