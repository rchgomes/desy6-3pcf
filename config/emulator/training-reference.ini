; Training set of the reference (matter-bispectrum) emulators:
; <Map^3> on thin redshift slices, bihalofit, no line-of-sight weighting.
;
;   python scripts/make_training_samples.py reference_lcdm --n 2000 --chunks 4
;   mpirun -n 32 cosmosis --mpi config/emulator/training-reference.ini -p DEFAULT.chunk=0
;   ... chunk=1, 2, 3; and the same with DEFAULT.cosmo=wcdm

[DEFAULT]
cosmo = lcdm
chunk = 0
name = reference_%(cosmo)s_%(chunk)s
sample_dir = ${DESY6_3PCF_DIR}/data/training/samples
output_dir = ${DESY6_3PCF_DIR}/data/training/output

[runtime]
sampler = list
verbosity = quiet

[list]
filename = %(sample_dir)s/%(name)s.txt

[output]
filename = %(output_dir)s/%(name)s.txt
format = text

[pipeline]
modules = consistency  bbn_consistency  camb  map3_binning  fastnc  nc_to_map3
values = ${DESY6_3PCF_DIR}/config/emulator/values-training.ini
; (number of redshift slices) x (number of filters) = 64 x 5
extra_output = map3/vector#320
timing = F
debug = F

%include ${DESY6_3PCF_DIR}/config/common/cosmology.ini

[map3_binning]
file = ${DESY6_3PCF_DIR}/modules/map3_binning.py
slices = T
; z_slices, filters and filter_mode default to the Y6 choices in
; desy6_3pcf/binning.py; if they are changed here, pass the same values to
; scripts/train_emulator.py and update extra_output above.

[fastnc]
file = ${DESY6_3PCF_DIR}/modules/fastnc_interface.py
matter_model = bihalofit
ia_model = none
use_pixwin = F
use_cache = T

[nc_to_map3]
file = ${DESY6_3PCF_DIR}/modules/nc_to_map3.py
