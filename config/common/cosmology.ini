; Background cosmology and matter power spectra.

[consistency]
file = ${COSMOSIS_STD_LIB}/utility/consistency/consistency_interface.py

[bbn_consistency]
file = ${COSMOSIS_STD_LIB}/utility/bbn_consistency/bbn_consistency.py

; S_8 is sampled; the consistency module turns it into sigma_8, to which
; CAMB rescales A_s.  fastnc needs the linear spectrum and the growth factor,
; the 2pt and TATT calculations the non-linear spectrum.
[camb]
file = ${COSMOSIS_STD_LIB}/boltzmann/camb/camb_interface.py
mode = power
feedback = 0
nonlinear = pk
halofit_version = takahashi
zmin_background = 0.
zmax_background = 4.
nz_background = 401
kmin = 1e-4
kmax = 50.0
kmax_extrapolate = 500.0
nk = 700
