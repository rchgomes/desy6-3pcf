; Source redshift distributions, intrinsic alignments and shear 2pt functions.
; Run files define 2pt_file (2pt FITS file with n(z), data and covariance)
; and ia (nla or tatt) in their [DEFAULT] section.

[fits_nz]
file = ${COSMOSIS_STD_LIB}/number_density/load_nz_fits/load_nz_fits.py
nz_file = %(2pt_file)s
data_sets = source
prefix_section = T
prefix_extension = T

[source_photoz_bias]
file = ${COSMOSIS_STD_LIB}/number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_source
bias_section = wl_photoz_errors
interpolation = linear

[fast_pt]
file = ${COSMOSIS_STD_LIB}/structure/fast_pt/fast_pt_interface.py
do_ia = T
k_res_fac = 0.5
verbose = F

[IA]
file = ${COSMOSIS_STD_LIB}/intrinsic_alignments/tatt/tatt_interface.py
sub_lowk = F
do_galaxy_intrinsic = F
ia_model = %(ia)s

[pk_to_cl]
file = ${COSMOSIS_STD_LIB}/structure/projection/project_2d.py
ell_min_logspaced = 0.1
ell_max_logspaced = 5.0e5
n_ell_logspaced = 100
shear-shear = source-source
shear-intrinsic = source-source
intrinsic-intrinsic = source-source
intrinsicb-intrinsicb = source-source
verbose = F
get_kernel_peaks = F
sig_over_dchi = 20.
shear_kernel_dchi = 10.

[add_intrinsic]
file = ${COSMOSIS_STD_LIB}/shear/add_intrinsic/add_intrinsic.py
shear-shear = T
position-shear = F
perbin = F

[2pt_shear]
file = ${COSMOSIS_STD_LIB}/shear/cl_to_xi_fullsky/cl_to_xi_interface.py
ell_max = 40000
xi_type = EB
theta_file = %(2pt_file)s
bin_avg = T
input_section_name = shear_cl  shear_cl_bb
output_section_name = shear_xi_plus  shear_xi_minus

[shear_m_bias]
file = ${COSMOSIS_STD_LIB}/shear/shear_bias/shear_m_bias.py
m_per_bin = True
cl_section = shear_xi_plus shear_xi_minus
verbose = F

; No scale cuts are applied for now.  To add them, set e.g.
;   angle_range_xip_1_1 = 2.5 250.0
; here (or in the run file); the masks below propagate them to the joint
; likelihood automatically.
[2pt_like]
file = ${COSMOSIS_STD_LIB}/likelihood/2pt/2pt_like.py
data_file = %(2pt_file)s
data_sets = xip xim
covmat_name = COVMAT
covariance_realizations = -1
include_norm = F

[2pt_mask]
file = ${DESY6_3PCF_DIR}/modules/data_mask.py
data_file = %(2pt_file)s
data_sets = xip xim
like_name = 2pt

; Write a synthetic 2pt data vector with the layout of 2pt_file
; (run after 2pt_like and 2pt_mask).
[save_2pt]
file = ${DESY6_3PCF_DIR}/modules/save_2pt.py
data_file = %(2pt_file)s
data_sets = xip xim
like_name = 2pt
