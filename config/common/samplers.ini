; Sampler settings.  Run files define output_dir and RUN_NAME.

[test]
save_dir = %(output_dir)s/%(run_name)s
fatal_errors = T

[fisher]
step_size = 0.01

[multinest]
max_iterations = 50000
multinest_outfile_root = %(output_dir)s/checkpoints/mn_%(run_name)s
resume = T
live_points = 500
efficiency = 0.3
tolerance = 0.1
constant_efficiency = F

[polychord]
base_dir = %(output_dir)s/checkpoints
polychord_outfile_root = pc_%(run_name)s
resume = T
feedback = 3
fast_fraction = 0.1
live_points = 500
num_repeats = 60
tolerance = 0.01
boost_posteriors = 10.0

[nautilus]
n_live = 2000
resume = T
filepath = %(output_dir)s/checkpoints/nautilus_%(run_name)s.hdf5
verbose = T

[emcee]
walkers = 80
samples = 10000
nsteps = 5
