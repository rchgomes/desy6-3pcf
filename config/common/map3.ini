; Third-order shear statistics: <Map^3> from fastnc or from the emulators.
; Run files define map3_file, joint_cov_file, emulator_dir, cosmo (lcdm or
; wcdm) and ia (nla or tatt) in their [DEFAULT] section.
;
; The 3PCF binning (1'-150', 25 log bins, 100 phi bins) and the aperture
; radii (3, 5, 10, 20, 40 arcmin) are the defaults of the modules, defined
; in desy6_3pcf/binning.py; they are spelled out below for reference.

[map3_binning]
file = ${DESY6_3PCF_DIR}/modules/map3_binning.py
data_file = %(map3_file)s
sample_combinations = all
; scale cuts (none for now):
; theta_range = 3.0 40.0

; ---- brute-force theory --------------------------------------------------
[fastnc]
file = ${DESY6_3PCF_DIR}/modules/fastnc_interface.py
min_sep = 1.0
max_sep = 150.0
nbins = 25
nphi_bins = 100
matter_model = bihalofit
ia_model = %(ia)s
Lmax = 50
Mmax = 100
nfft = 150
projection = cent
use_pixwin = F
use_cache = T
baryon_model = none

[nc_to_map3]
file = ${DESY6_3PCF_DIR}/modules/nc_to_map3.py

; ---- emulated theory -----------------------------------------------------
[map3_emulator]
file = ${DESY6_3PCF_DIR}/modules/map3_emulator.py
reference = %(emulator_dir)s/reference_%(cosmo)s
ia_model = %(ia)s
; the TATT emulators are trained on the wCDM box and serve both models
tatt_template = %(emulator_dir)s/tatt_{component}
nz_upsampling = 300
out_of_range = reject

; ---- systematics, likelihoods, output --------------------------------------
[map3_m_bias]
file = ${DESY6_3PCF_DIR}/modules/map3_m_bias.py

[map3_like]
file = ${DESY6_3PCF_DIR}/modules/map3_likelihood.py
data_file = %(map3_file)s
covariance_realizations = -1
free_parameters = -1
percival = F

[joint_like]
file = ${DESY6_3PCF_DIR}/modules/joint_likelihood.py
data_file = %(joint_cov_file)s
like_names = 2pt map3
2pt_data_sets = xip xim
map3_data_sets = map3
like_name = joint
covariance_realizations = -1
free_parameters = -1
percival = F

[save_map3]
file = ${DESY6_3PCF_DIR}/modules/save_map3.py
copy_covariance = %(map3_file)s
