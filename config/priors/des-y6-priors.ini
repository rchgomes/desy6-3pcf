; Gaussian priors on the nuisance parameters.
;
; !!! PLACEHOLDERS !!!
; The widths below are stand-ins so that the pipelines run end to end.
; Replace them with the DES Y6 shear-calibration and redshift priors before
; any real analysis.

[shear_calibration_parameters]
m1 = gaussian 0.0 0.01
m2 = gaussian 0.0 0.01
m3 = gaussian 0.0 0.01
m4 = gaussian 0.0 0.01

[wl_photoz_errors]
bias_1 = gaussian 0.0 0.02
bias_2 = gaussian 0.0 0.02
bias_3 = gaussian 0.0 0.02
bias_4 = gaussian 0.0 0.02
