; One evaluation of the full pipeline at the central parameter values.
;
; Uses:
;  * make a synthetic (noiseless) data vector with brute-force fastnc,
;      cosmosis config/validation/predict.ini
;  * validate the emulators after the line-of-sight integration: point
;    map3_file at that synthetic file and predict with the emulators,
;      cosmosis config/validation/predict.ini -p DEFAULT.theory=map3_emulator DEFAULT.tag=emulator \
;               DEFAULT.map3_file=output/validation/map3-fastnc-lcdm-nla.fits
;    then look at the reported map3 chi2, or compare the two files with
;      python scripts/compare_map3.py output/validation/map3-{fastnc,emulator}-lcdm-nla.fits

[DEFAULT]
cosmo = lcdm
ia = nla
; modules that predict <Map^3>: "fastnc nc_to_map3" or "map3_emulator"
theory = fastnc nc_to_map3
tag = fastnc
2pt_file = ${DESY6_3PCF_DIR}/data/dv/2pt.fits
map3_file = ${DESY6_3PCF_DIR}/data/dv/map3.fits
joint_cov_file = ${DESY6_3PCF_DIR}/data/dv/cov_xip_xim_map3.fits
emulator_dir = ${DESY6_3PCF_DIR}/data/emulators
output_dir = ${DESY6_3PCF_DIR}/output/validation
run_name = %(tag)s-%(cosmo)s-%(ia)s

[runtime]
sampler = test
verbosity = standard

[pipeline]
modules = consistency  bbn_consistency  camb
          fast_pt  fits_nz  source_photoz_bias  IA
          pk_to_cl  add_intrinsic  2pt_shear  shear_m_bias
          2pt_like  2pt_mask  save_2pt
          map3_binning  %(theory)s  map3_m_bias  map3_like  save_map3
likelihoods = 2pt map3
values = ${DESY6_3PCF_DIR}/config/values/%(cosmo)s-%(ia)s.ini
priors = ${DESY6_3PCF_DIR}/config/priors/des-y6-priors.ini
timing = T
debug = F

%include ${DESY6_3PCF_DIR}/config/common/cosmology.ini
%include ${DESY6_3PCF_DIR}/config/common/cosmic-shear.ini
%include ${DESY6_3PCF_DIR}/config/common/map3.ini
%include ${DESY6_3PCF_DIR}/config/common/samplers.ini

[save_2pt]
filename = %(output_dir)s/2pt-%(run_name)s.fits

[save_map3]
filename = %(output_dir)s/map3-%(run_name)s.fits
